plugins {
    id "com.android.application"
    id "dev.flutter.flutter-gradle-plugin"
    id "com.google.gms.google-services"
}

def localProperties = new Properties()
def localPropertiesFile = rootProject.file('local.properties')
if (localPropertiesFile.exists()) {
    localPropertiesFile.withReader('UTF-8') { reader ->
        localProperties.load(reader)
    }
}

def flutterVersionCode = localProperties.getProperty('flutter.versionCode')
if (flutterVersionCode == null) {
    flutterVersionCode = '1'
}

def flutterVersionName = localProperties.getProperty('flutter.versionName')
if (flutterVersionName == null) {
    flutterVersionName = '1.0'
}

def keystoreProperties = new Properties()
def keystorePropertiesFile = rootProject.file('key.properties')
if (keystorePropertiesFile.exists()) {
    keystoreProperties.load(new FileInputStream(keystorePropertiesFile))
}

android {
    namespace 'com.muserpol.pvt'
    compileSdkVersion 36
    ndkVersion '28.2.13676358'

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    kotlinOptions {
        jvmTarget = '1.8'
    }

    sourceSets {
        main.java.srcDirs += 'src/main/kotlin'
    }

    defaultConfig {
        applicationId "com.muserpol.pvt"
        minSdkVersion 24
        targetSdkVersion 36
        versionCode 83
        versionName "4.1.3"
        multiDexEnabled true
    }

    signingConfigs {
        release {
            keyAlias keystoreProperties['keyAlias']
            keyPassword keystoreProperties['keyPassword']
            storeFile file(keystoreProperties['storeFile'])
            storePassword keystoreProperties['storePassword']
            v1SigningEnabled true
            v2SigningEnabled true
        }
    }

    buildTypes {
        release {
            signingConfig signingConfigs.release
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    packaging {
        jniLibs {
            useLegacyPackaging = true
        }
    }

    lint {
        checkReleaseBuilds false
    }
}

flutter {
    source '../..'
}

project.afterEvaluate {
    def jniLibsDir = project.layout.buildDirectory.dir("intermediates/flutter/release/jniLibs")
    
    tasks.matching { it.name == 'stripReleaseDebugSymbols' }.configureEach {
        dependsOn 'copyJniLibsflutterBuildRelease'
        doLast {
            jniLibsDir.get().asFile.listFiles()?.each { abiDir ->
                if (abiDir.isDirectory()) {
                    def destDir = new File(project.buildDir, "intermediates/stripped_native_libs/release/stripReleaseDebugSymbols/out/lib/${abiDir.name}")
                    if (destDir.exists()) {
                        abiDir.listFiles().each { soFile ->
                            project.copy {
                                from soFile
                                into destDir
                            }
                        }
                    }
                }
            }
        }
    }
}

dependencies {
    implementation 'com.google.firebase:firebase-analytics-ktx:22.1.2'
    implementation 'com.google.firebase:firebase-messaging-ktx:24.1.0'
    implementation 'androidx.multidex:multidex:2.0.1'
    implementation 'com.google.mlkit:text-recognition:16.0.0'
    implementation 'androidx.core:core-ktx:1.15.0'
    implementation 'androidx.activity:activity-ktx:1.9.3'
}
